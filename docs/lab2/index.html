<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 2 | เลือกหัวข้อย่อย</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Sarabun", "Noto Sans Thai", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.15), transparent 20%),
                  #0f172a;
    }
    .page {
      width: min(900px, 100%);
      padding: 32px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: 0 24px 90px rgba(15, 23, 42, 0.45);
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: #7dd3fc;
    }
    .subtext {
      margin: 0 0 24px;
      color: #cbd5e1;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 172px;
      padding: 22px;
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(30, 41, 59, 0.75);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.16);
      border-color: #22c55e;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .card-desc {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="../index.html">← กลับหน้ารวม Lab</a>
    <h1>Lab 2</h1>
    <p class="subtext">เลือกหัวข้อย่อยของ Lab 2 ที่ต้องการเปิดได้เลย</p>

    <section class="grid">
      <a class="card" href="lab2_1/lab2_1.html">
        <div>
          <div class="card-title">Lab 2.1</div>
          <div class="card-desc">เปิดผลงาน Lab 2.1</div>
        </div>
      </a>
      <a class="card" href="lab2_2/lab2_2.html">
        <div>
          <div class="card-title">Lab 2.2</div>
          <div class="card-desc">เปิดผลงาน Lab 2.2</div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
